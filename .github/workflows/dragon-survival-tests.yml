name: Dragon Survival Core Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dragon-survival-core]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Run electric dragon simulation
        run: npm run simulate:electric
      - name: Run all dragon profiles simulation
        run: npm run simulate:all
